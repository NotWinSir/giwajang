<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Giwajang — gwimyeon demon-face roof tile">
  <rect width="64" height="64" rx="14" fill="#a6e22e"/>
  <!-- tile slab: arched top edge, sides flaring out, sagging bottom profile -->
  <path d="M20 7 Q32 3 44 7 L52 50 Q32 57 12 50 Z" fill="none" stroke="#141414" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M22.5 12 Q32 8.5 41.5 12 L47.5 47 Q32 52.5 16.5 47 Z" fill="none" stroke="#141414" stroke-width="1.4"/>
  <!-- studs between the borders -->
  <g fill="#141414">
    <circle cx="18.2" cy="16" r="1.5"/><circle cx="16.6" cy="25" r="1.5"/><circle cx="15" cy="34" r="1.5"/><circle cx="13.6" cy="43" r="1.5"/>
    <circle cx="45.8" cy="16" r="1.5"/><circle cx="47.4" cy="25" r="1.5"/><circle cx="49" cy="34" r="1.5"/><circle cx="50.4" cy="43" r="1.5"/>
  </g>
  <!-- forehead ornament -->
  <circle cx="32" cy="13.5" r="1.8" fill="#141414"/>
  <path d="M25 17 Q32 13.5 39 17" fill="none" stroke="#141414" stroke-width="1.8" stroke-linecap="round"/>
  <!-- angry brows -->
  <path d="M19.5 21.5 Q25 18.5 30.5 21.5" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M33.5 21.5 Q39 18.5 44.5 21.5" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round"/>
  <!-- bulging eyes -->
  <circle cx="25" cy="27" r="3.6" fill="#141414"/>
  <circle cx="39" cy="27" r="3.6" fill="#141414"/>
  <!-- nose wedge -->
  <path d="M27.5 34.5 Q32 33 36.5 34.5 L33.8 39.3 Q32 40.3 30.2 39.3 Z" fill="#141414"/>
  <!-- wide grin with fangs -->
  <path d="M20 41.5 H44 Q32 51.5 20 41.5 Z" fill="#141414"/>
  <path d="M23.5 41.9 L27.5 41.9 L25.5 45.9 Z" fill="#a6e22e"/>
  <path d="M36.5 41.9 L40.5 41.9 L38.5 45.9 Z" fill="#a6e22e"/>
</svg>
